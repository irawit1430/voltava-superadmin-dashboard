<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Voltava Drive — fleet intelligence console for Voltava Energy Systems." />
    <title>Voltava Drive | Fleet Management</title>
    <!-- Loaded here rather than via `@import url()` inside index.css, which is
         the slowest possible path and blocks rendering on every page load. A plain
         link: the media="print" onload trick is inline script, which the Content
         Security Policy in firebase.json refuses to run. display=swap keeps text
         visible while the font loads. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
